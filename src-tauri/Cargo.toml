[package]
name = "codesu"
version = "0.1.0"
description = "Codesu — a desktop IDE for running and managing Claude AI agents"
authors = ["Codesu Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/kmlcnclk/codesu"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codesu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Capitalized so `tauri dev` (which runs this binary directly, without an
# .app bundle/Info.plist) shows "Codesu" in the Dock instead of the lowercase
# crate name.
name = "Codesu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"

