[package]
name = "codesu"
version = "0.1.0"
description = "Codesu — a desktop IDE for running and managing Claude AI agents"
authors = ["Codesu Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/kmlcnclk/codesu"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codesu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Capitalized so `tauri dev` (which runs this binary directly, without an
# .app bundle/Info.plist) shows "Codesu" in the Dock instead of the lowercase
# crate name.
name = "Codesu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"

# Shipping profile. Without it the bundled .app carries a debug-assertion-free but
# otherwise unoptimized binary, several times larger than it needs to be.
#
# `panic = "abort"` only applies here: Cargo ignores the setting for the test and bench
# profiles (they need unwinding for `#[should_panic]` and for reporting failures), so
# `cargo test` — debug or release — is unaffected.
[profile.release]
codegen-units = 1  # one unit means LTO actually has the whole crate to work with
lto = true
opt-level = "s"    # size over raw speed; the hot path here is blocking pty I/O
strip = true
# NO `panic = "abort"`. A panic in a lock guard would otherwise take the whole process
# down instantly, skipping RunEvent::ExitRequested — which is what runs kill_all(), so
# every live `claude` child would be orphaned, and the frontend's flush-on-close would
# never land either. Unwinding keeps that shutdown path reachable.

